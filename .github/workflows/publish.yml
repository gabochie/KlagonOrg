# KLAGON scheduled publishing — rebuilds + redeploys the static site daily.
# Any blog post in content/blog/ with `status: scheduled` stays hidden until
# its `date` arrives (see content/blog/README.md), then surfaces automatically
# on the next run — no commit churn for a publish.
#
# Needs one repo Secret: CLOUDFLARE_API_TOKEN (Pages:Edit on klagon-org).
# Reuses the repo Variables NEXT_PUBLIC_SUPABASE_URL / _ANON_KEY (same as ci).
#
# If this workflow has never gone green, the secret is almost certainly the
# reason. Until it is set, the "Check deploy credentials" step below fails the
# run with an explicit message, and the "Verify deployment is live" step is
# skipped. Nothing publishes silently.

name: publish

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Production build (regenerates RSS + prerenders all pages)
        run: npm run build

      # Wrangler's own failure here is unhelpfully generic ("in a
      # non-interactive environment, it's necessary to set a
      # CLOUDFLARE_API_TOKEN"). Check up front and say what is actually wrong.
      # Every scheduled run failed for six days on a missing token before this
      # existed, and the real cause was buried at the end of a wrangler log.
      - name: Check deploy credentials
        id: gate
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not set. Create a token with Pages:Edit on klagon-org (Cloudflare dashboard -> My Profile -> API Tokens) and add it under repo Settings -> Secrets and variables -> Actions."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.gate.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: pages deploy out --project-name klagon-org --branch main

      - name: Verify deployment is live
        if: steps.gate.outputs.ready == 'true'
        run: |
          # A green wrangler step is not proof the new build is being served;
          # a cached old deploy also exits 0. Poll the real origin and wait for
          # it to answer, so "published" means reachable, not just uploaded.
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://klagon.org/ || true)
            if [ "$code" = "200" ]; then
              echo "klagon.org is serving (HTTP 200) after $((i * 15))s"
              exit 0
            fi
            echo "attempt $i: HTTP $code, retrying in 15s"
            sleep 15
          done
          echo "::error::klagon.org did not return 200 after 150s"
          exit 1