# KLAGON quality gates — typecheck, lint, unit + component tests, build, E2E.
# Runs on every push to main and every pull request. Fails fast in order:
# nothing lints, tests, or ships if the types don't even check.
#
# Zero secrets required for gates. The two NEXT_PUBLIC values are public
# (they ship in the client bundle anyway) — set them as GitHub *Variables*
# (repo Settings -> Secrets and variables -> Actions -> Variables tab), NOT
# secrets. Without them the build has no data to prerender and Next
# misreports dynamic routes as missing generateStaticParams.
#
#   NEXT_PUBLIC_SUPABASE_URL      (e.g. https://xyz.supabase.co)
#   NEXT_PUBLIC_SUPABASE_ANON_KEY (the anon key from .env.local)
#
# The e2e suite is split in two. `e2e-readonly` runs on every push and every pull
# request and needs nothing secret; the specs it runs never write. `e2e-mutating`
# runs on main and manual dispatch only, and needs four throwaway-account
# *Secrets* (same tab, Secrets section) — real Supabase Auth users it writes
# through:
#
#   E2E_MEMBER_EMAIL / E2E_MEMBER_PASSWORD (role: member, status: approved)
#   E2E_ADMIN_EMAIL / E2E_ADMIN_PASSWORD   (role: admin,  status: approved)
# Without them the authenticated specs skip and the job still passes.
#
# Which spec belongs to which lane is e2e/lanes.json, checked by
# scripts/verify-e2e-lanes.mjs on every build.

name: ci

# `gates` and `e2e-readonly` are the required checks on main. `e2e-readonly`
# exists because e2e previously never ran on a pull request, so a merge could
# break the browser suite with a green check.

on:
  push:
    branches: [main]
  pull_request:
  # Manual rerun. Paired with the `if` on the e2e job below: push to main runs
  # the full suite, a pull request runs gates only, and this runs gates + e2e
  # on demand without touching main.
  workflow_dispatch:

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      # Component tests live in their own vitest config (jsdom + testing-library)
      # so `npm test` stays the fast pure-kernel lane and nothing browser-shaped
      # reaches the static export. Cheap enough to run inline before the build.
      - name: Component tests
        run: npm run test:components

      - name: Production build
        run: npm run build

      # The e2e job below is a separate job on a separate runner, and out/ is
      # gitignored, so the export simply did not exist there. `serve out` then
      # had nothing to mount and every run died on
      # "Timed out waiting 180000ms from config.webServer" -- the e2e suite had
      # never actually executed on CI. Ship the export across instead of paying
      # for a second build.
      #
      # compression-level: 0 is deliberate. The export is ~140MB of prerendered
      # HTML plus already-compressed PNGs (directory/ 77MB, brand/ 35MB), so
      # zipping it burns runner CPU and minutes to save almost nothing.
      - name: Upload static export
        uses: actions/upload-artifact@v4
        with:
          name: static-export
          path: out/
          retention-days: 1
          compression-level: 0

  # End-to-end, split by what a spec is allowed to do to the database.
  #
  # e2e-readonly runs on every push and every pull request, including forks.
  # It carries no write path and needs no credentials, so it is safe anywhere.
  # This is the job that closes the hole where e2e never validated a PR.
  #
  # e2e-mutating stays on main and manual dispatch only. These specs create posts,
  # boost requests and directory claims against the real Supabase project and rely
  # on global-teardown.ts sweeping the rows afterwards. That teardown is the right
  # safety net for a scheduled main-branch run; making every pull request --
  # including ones from forks -- a production write is a materially different
  # risk. If a staging Supabase project is ever added, move this one to
  # `pull_request` too and point it there.
  #
  # Which spec is in which lane lives in e2e/lanes.json and is enforced by
  # scripts/verify-e2e-lanes.mjs on every build, so this split cannot silently rot.
  e2e-readonly:
    needs: [gates]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Download static export
        uses: actions/download-artifact@v4
        with:
          name: static-export
          path: out/

      - name: End-to-end tests (read-only)
        run: npx playwright test --project=chromium --project=mobile

  e2e-mutating:
    needs: [gates]
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      E2E_MEMBER_EMAIL: ${{ secrets.E2E_MEMBER_EMAIL }}
      E2E_MEMBER_PASSWORD: ${{ secrets.E2E_MEMBER_PASSWORD }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Download static export
        uses: actions/download-artifact@v4
        with:
          name: static-export
          path: out/

      # The specs expect a real static export, not `next dev`, and global-setup
      # re-verifies that the served site is actually KLAGON before the suite
      # runs -- so the artifact has to be in place before Playwright starts its
      # webServer, which is why this download precedes the test step.
      - name: End-to-end tests (mutating)
        run: npx playwright test --project=mutating --reporter=list
