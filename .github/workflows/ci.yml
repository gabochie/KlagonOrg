# KLAGON quality gates — typecheck, lint, unit tests, production build.
# Runs on every push to main and every pull request. Fails fast in order:
# nothing lints, tests, or ships if the types don't even check.
#
# Zero secrets required. The two NEXT_PUBLIC values are public (they ship
# in the client bundle anyway) — set them as GitHub *Variables* (repo
# Settings -> Secrets and variables -> Actions -> Variables tab), NOT
# secrets. Without them the build has no data to prerender and Next
# misreports dynamic routes as missing generateStaticParams.
#
#   NEXT_PUBLIC_SUPABASE_URL      (e.g. https://xyz.supabase.co)
#   NEXT_PUBLIC_SUPABASE_ANON_KEY (the anon key from .env.local)

name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build
